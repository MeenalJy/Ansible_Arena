---
- name: Require Debian-family target
  ansible.builtin.assert:
    that: ansible_os_family == 'Debian'

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy static page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Verify Nginx serves the configured page
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: 200
    return_content: true
  register: nginx_http_response
  retries: 5
  delay: 2
  until: nginx_http_response.status == 200
  when: not ansible_check_mode

- name: Verify expected page title
  ansible.builtin.assert:
    that:
      - (nginx_page_title | e) in nginx_http_response.content
    fail_msg: Nginx responded but the expected page title was not found.
  when: not ansible_check_mode
